run_name: scale_7b_fsdp
out_dir: outputs/scale_7b

model:
  vision_model: google/siglip2-base-patch16-224   # keep base for apples-to-apples with stage 1
  lm_model: Qwen/Qwen2.5-7B
  freeze_vision: true
  freeze_lm: false
  train_projector: true
  lora_r: 32
  lora_alpha: 64

data:
  data_json: data/llava_pretrain_50k.json
  image_root: data/images
  max_samples: 10000          # plenty for a benchmark — you only run ~200 steps
  max_seq_len: 384

train:
  lr: 1.0e-3                  # projector
  lm_lr: 2.0e-5               # LoRA
  batch_size: 4               # per-GPU
  grad_accum_steps: 1         # set per-config to keep effective batch constant
  max_steps: 250              # 50 warmup + 200 measured
  warmup_steps: 50
  dtype: bf16
  log_every: 10
  save_every: 99999           # don't save during benchmark runs